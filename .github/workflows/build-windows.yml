name: Build Windows EXE

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile ecosystem.py

      - name: Create ZIP
        run: Compress-Archive -Path dist/ecosystem.exe -DestinationPath ecosystem.zip

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mini-Ecosystem Latest
          prerelease: false
          files: ecosystem.zip
          make_latest: true
